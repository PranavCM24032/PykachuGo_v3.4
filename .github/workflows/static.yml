# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create client runtime config
        env:
          GOOGLE_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwloiCwYYeoQQvzjccERsb5YvI2j9MEq_7lBa68M8QaYIfspD-lfpUURfIOxi-ZlNF_/exec
          GOOGLE_SCRIPT_TOKEN: ${{ secrets.GOOGLE_SCRIPT_TOKEN }}
          GOOGLE_SHEET_URL: https://docs.google.com/spreadsheets/d/1sXcAgdp9dDJ9ygx2xkBSdC3HyRlC-5TxDQ_y-Gyrg30/edit?gid=1056900225#gid=1056900225
        run: >-
          node -e "const fs=require('fs');const config={googleScriptUrl:process.env.GOOGLE_SCRIPT_URL||'',googleScriptToken:process.env.GOOGLE_SCRIPT_TOKEN||'',googleSheetUrl:process.env.GOOGLE_SHEET_URL||''};fs.writeFileSync('js/runtime-config.js','window.PYKACHU_RUNTIME_CONFIG = '+JSON.stringify(config,null,4)+';\\n');"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
