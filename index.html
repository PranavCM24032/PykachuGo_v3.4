<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pykachu Go</title>
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://s.ytimg.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@300;400;600&family=Handlee&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/shell.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/overlays.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/success.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/security.css">
    <link rel="stylesheet" href="css/meme.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/img/poketropy.png" type="image/png">

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#c91f1f">
    <meta name="mobile-web-app-capable" content="yes">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => { });
            });
        }
    </script>

    <style>
        /* Mobile-specific optimizations */
        @media (max-width: 640px) {
            .pokedex-shell {
                padding: 10px !important;
            }

            .crt-container {
                margin: 4px !important;
                border-width: 2px !important;
            }

            .btn-pokedex {
                padding: 8px 12px !important;
                font-size: 12px !important;
            }

            input,
            select {
                font-size: 16px !important;
            }
        }

        @media (max-width: 380px) {
            .font-pixel {
                font-size: 10px !important;
            }

            .material-symbols-rounded {
                font-size: 18px !important;
            }
        }

        html {
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        button:active,
        .pokedex-button-bar:active,
        .pokedex-button-alt:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        @media (max-height: 700px) {
            #step3 .code-terminal {
                max-height: 40vh !important;
            }
        }

        /* Safe-areas are handled in base.css and the body inline style.
           This block is for non-layout tweaks only. */
    </style>
</head>

<body class="bg-[#050810] font-mono overflow-x-hidden touch-manipulation"
    style="width:100%; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding: env(safe-area-inset-top,4px) env(safe-area-inset-right,4px) env(safe-area-inset-bottom,4px) env(safe-area-inset-left,4px); box-sizing:border-box; margin:0;">
    <div class="pokedex-shell flex flex-col">

        <!-- Top Header Section -->
        <div class="flex gap-2 sm:gap-3 mb-3 sm:mb-4 px-2 pt-1 flex-shrink-0">
            <!-- Avatar Container -->
            <div
                class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center relative flex-shrink-0">
                <div class="absolute -inset-1 bg-blue-400/30 rounded-full blur-sm"></div>

                <div
                    class="absolute inset-0 rounded-full bg-gradient-to-br from-blue-400 via-blue-500 to-blue-600 border-2 sm:border-3 md:border-4 border-white shadow-[inset_0_-4px_8px_rgba(0,0,0,0.3),inset_0_4px_8px_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.4)] overflow-hidden">
                    <div
                        class="absolute inset-0 rounded-full bg-gradient-to-br from-transparent via-blue-300/20 to-transparent">
                    </div>

                    <div
                        class="absolute top-1 left-1 w-2 h-2 sm:w-2 sm:h-2 md:top-1.5 md:left-1.5 md:w-3 md:h-3 bg-gradient-to-br from-white to-blue-100 rounded-full opacity-70">
                    </div>
                    <div
                        class="absolute top-0.5 right-1 w-1.5 h-1.5 sm:w-1.5 sm:h-1.5 md:top-1 md:right-1.5 md:w-2.5 md:h-2.5 bg-gradient-to-br from-white/60 to-transparent rounded-full blur-[1px]">
                    </div>

                    <div class="absolute inset-1.5 sm:inset-2 md:inset-2.5 border border-white/30 rounded-full"></div>

                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-1 h-1 sm:w-1 sm:h-1 md:w-1.5 md:h-1.5 bg-white/40 rounded-full blur-[1px]"></div>
                    </div>
                </div>
            </div>

            <!-- Center Content -->
            <div class="flex-1 text-center flex flex-col justify-center">
                <h1 class="text-base sm:text-lg md:text-xl font-pixel text-white select-none truncate px-1"
                    style="text-shadow: 0 2px 6px rgba(4, 7, 19, 0.9), 0 0 8px rgba(19, 40, 73, 0.5);">
                    <span class="text-blue-400">P</span><span class="text-yellow-300">y</span><span
                        class="text-blue-400">KaChu</span><span class="text-yellow-300"> Go</span>
                </h1>
                <p class="text-[10px] sm:text-xs md:text-sm text-slate-200 font-medium truncate">Decode Code. Capture
                    Pikachu.</p>
            </div>

            <!-- Status Dots -->
            <div class="flex gap-1 sm:gap-1.5 pt-1 sm:pt-1.5 flex-shrink-0">
                <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 md:w-3.5 md:h-3.5 rounded-full relative">
                    <div
                        class="absolute inset-0 rounded-full bg-gradient-to-br from-red-500 via-red-600 to-red-700 border border-red-900/80">
                    </div>
                    <div
                        class="absolute inset-0 rounded-full shadow-[inset_0_1px_2px_rgba(255,255,255,0.3),inset_0_-1px_2px_rgba(0,0,0,0.5)]">
                    </div>
                    <div
                        class="absolute top-0.5 left-0.5 w-1 h-1 sm:w-1 sm:h-1 md:w-1.5 md:h-1.5 bg-white/60 rounded-full blur-[0.5px]">
                    </div>
                    <div class="absolute inset-0 rounded-full bg-red-500/30 blur-[1px] animate-pulse"
                        style="animation-duration: 2s;"></div>
                </div>

                <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 md:w-3.5 md:h-3.5 rounded-full relative">
                    <div
                        class="absolute inset-0 rounded-full bg-gradient-to-br from-yellow-300 via-yellow-400 to-yellow-500 border border-yellow-700/80">
                    </div>
                    <div
                        class="absolute inset-0 rounded-full shadow-[inset_0_1px_2px_rgba(255,255,255,0.4),inset_0_-1px_2px_rgba(0,0,0,0.4)]">
                    </div>
                    <div
                        class="absolute top-0.5 left-0.5 w-1 h-1 sm:w-1 sm:h-1 md:w-1.5 md:h-1.5 bg-white/70 rounded-full blur-[0.5px]">
                    </div>
                    <div class="absolute inset-0 rounded-full bg-yellow-400/30 blur-[1px] animate-pulse"
                        style="animation-duration: 2.5s; animation-delay: 0.5s;"></div>
                </div>

                <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 md:w-3.5 md:h-3.5 rounded-full relative">
                    <div
                        class="absolute inset-0 rounded-full bg-gradient-to-br from-green-400 via-green-500 to-green-600 border border-green-800/80">
                    </div>
                    <div
                        class="absolute inset-0 rounded-full shadow-[inset_0_1px_2px_rgba(255,255,255,0.3),inset_0_-1px_2px_rgba(0,0,0,0.5)]">
                    </div>
                    <div
                        class="absolute top-0.5 left-0.5 w-1 h-1 sm:w-1 sm:h-1 md:w-1.5 md:h-1.5 bg-white/60 rounded-full blur-[0.5px]">
                    </div>
                    <div class="absolute inset-0 rounded-full bg-green-500/30 blur-[1px] animate-pulse"
                        style="animation-duration: 3s; animation-delay: 1s;"></div>
                </div>
            </div>
        </div>

        <!-- Main Display Area -->
        <div class="crt-container flex-1 min-h-0">
            <div id="screen" class="crt-screen overflow-y-auto scrollable relative">
                <!-- Celebration Canvas -->
                <canvas id="celebrationCanvas" class="absolute inset-0 pointer-events-none z-[100]"></canvas>

                <!-- Full-Width Minimal Internal Status HUD -->
                <div class="internal-status-bar">
                    <div id="statusLvl" class="status-item is-empty !p-0 !gap-1">
                        <span class="material-symbols-rounded text-[12px]">analytics</span>
                        <span id="teamLevelDisplay" class="status-val text-[10px]">00</span>
                    </div>

                    <div class="status-divider"></div>

                    <div id="statusTeam" class="status-item is-empty !p-0 !gap-1">
                        <span class="material-symbols-rounded text-[14px]">shield_person</span>
                        <span id="teamNameInput" class="team-val font-bold text-[10px]">NO TEAM</span>
                    </div>

                    <div class="status-divider"></div>

                    <div id="statusType" class="status-item is-empty !p-0 !gap-1">
                        <span id="teamTypeDisplay" class="status-val text-[10px]">SYS</span>
                        <span class="material-symbols-rounded text-[12px]">dynamic_form</span>
                    </div>
                </div>

                <!-- Steps loaded from partials -->
                <div data-include="html/step0.html"></div>
                <div data-include="html/step1.html"></div>
                <div data-include="html/step2.html"></div>
                <div data-include="html/startcode.html"></div>
                <div data-include="html/step3.html"></div>
                <div data-include="html/step4.html"></div>

                <!-- Overlays loaded from partials -->
                <div data-include="html/penalty.html"></div>
                <div data-include="html/hint.html"></div>

                <!-- Meme player loaded from partial -->
                <div data-include="html/meme.html"></div>

            </div> <!-- End Screen -->
        </div> <!-- End CRT Container -->

        <!-- Compact Auxiliary Interface -->
        <div class="flex justify-between items-center mt-2 px-2 flex-shrink-0"
            style="padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));">
            <div class="flex gap-2">
                <div id="aux-btn-1"
                    class="pokedex-button-bar w-10 h-3 sm:w-12 sm:h-3.5 bg-slate-800 rounded-full shadow-lg cursor-pointer hover:bg-slate-700 active:translate-y-0.5 transition-all min-h-[20px]"
                    onclick="handleAuxClick(1)" role="button" aria-label="Audio toggle button" tabindex="0"> </div>
                <div id="aux-btn-2"
                    class="pokedex-button-bar w-10 h-3 sm:w-12 sm:h-3.5 bg-slate-800 rounded-full shadow-lg cursor-pointer hover:bg-slate-700 active:translate-y-0.5 transition-all min-h-[20px]"
                    onclick="handleAuxClick(2)" role="button" aria-label="Connection test button" tabindex="0"></div>

            </div>

            <div id="aux-power"
                class="pokedex-button-alt w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center cursor-pointer group min-h-[32px] min-w-[32px]"
                onclick="togglePowerMode()" role="button" aria-label="Power toggle" tabindex="0">
                <div
                    class="w-5 h-5 sm:w-5.5 sm:h-5.5 rounded-full bg-slate-900 shadow-inner flex items-center justify-center group-active:scale-95 transition-transform">
                    <div id="power-indicator" class="w-2 h-2 rounded-full power-on transition-all">
                    </div>
                </div>
            </div>
        </div>
    </div> <!-- End Pokedex Shell -->

    <script src="js/include.js"></script>
    <script src="js/runtime-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/rate-limiter.js"></script>
    <script src="js/google-sheets.js"></script>
    <script src="js/notepad.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/meme.js"></script>
    <script src="js/penalty.js"></script>
    <script src="js/hint.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
    <script src="js/security.js"></script>
</body>

</html>
