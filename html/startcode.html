<div id="startcode" class="flow-step h-full">
    <div class="flex flex-col h-full justify-center items-center gap-4 p-3 sm:p-5">
        <div class="w-full text-center shrink-0">
            <!-- Gym Badge Display -->
            <div id="step3BadgeContainer" class="gym-badge-container hidden animate-fade-in">
                <div class="badge-sparkle"></div>
                <img id="gymBadgeImg" src="" alt="Gym Badge" class="gym-badge-image">
            </div>

            <h2
                class="font-pixel text-yellow-500 mb-1 tracking-widest uppercase text-xs sm:text-sm">
                Encryption Detected
            </h2>
            <p class="hidden text-gray-400 text-[10px] sm:text-xs">Input decryption key to proceed</p>
        </div>

        <form id="unlockForm" class="w-full max-w-xs sm:max-w-sm">
            <div class="mb-3 sm:mb-4">
                <label
                    class="block text-gray-500 uppercase tracking-widest mb-1 font-bold text-[10px] sm:text-xs">
                    Start Key
                </label>
                <div class="relative group">
                    <input type="text" id="unlockCode"
                        class="w-full bg-black/40 border-2 border-gray-800 rounded-xl px-3 py-2.5 sm:py-3 text-white focus:border-yellow-500 focus:outline-none placeholder-gray-600 uppercase transition-all text-xs sm:text-sm"
                        placeholder="ENCRYPTION KEY" autocomplete="off" required maxlength="50"
                        autocapitalize="characters">
                    <span
                        class="material-symbols-rounded absolute right-3 top-1/2 -translate-y-1/2 text-yellow-500/50 group-focus-within:text-yellow-500 transition-colors text-base sm:text-lg">
                        key
                    </span>
                </div>
            </div>

            <div id="unlockFeedback"
                class="hidden text-[10px] sm:text-xs p-2 rounded-xl mb-2 bg-red-900/20 border border-red-900/40 text-red-100 font-pixel">
            </div>

            <div class="flex gap-2">
                <button type="submit" onmousedown="playSound('click')"
                    class="btn-pokedex flex-[2] flex items-center justify-center gap-1.5 py-2.5 sm:py-3 text-xs sm:text-sm"
                    style="background: linear-gradient(145deg, #F59E0B, #D97706); border-bottom: 3px solid #92400E;">
                    <span class="material-symbols-rounded text-base sm:text-lg">lock_open</span>
                    VERIFY
                </button>

                <button type="button" onclick="backToStep2()" onmousedown="playSound('click')"
                    class="flex-1 bg-gray-800/50 border-2 border-gray-700 rounded-xl flex items-center justify-center text-gray-400 hover:text-white transition-all py-2.5 sm:py-3">
                    <span class="material-symbols-rounded text-base sm:text-lg">arrow_back</span>
                </button>
            </div>
        </form>
    </div>
</div>
