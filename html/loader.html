<!-- Splitter loader: CSI x Auron presents Pykachu Go.
     Injected into index.html's #screen by js/include.js (data-include) and
     removed by js/loader.js after ~1.5s, revealing step0 underneath.

     Deliberately NOT a .flow-step: showStep() queries .flow-step and hard-removes
     every active state it finds, so a splash registered as a step would force the
     step state machine to know about a screen that isn't a step.

     Paths are document-relative, like the other partials in this folder, because
     this fragment is only ever rendered inside index.html. -->
<div id="appLoader" class="loader-surface" role="status" aria-label="Loading Pykachu Go">
    <div class="loader-stage">
        <!-- Row 1: CSI and Auron, each in a circle, joined by a cross -->
        <div class="partner-row">
            <span class="mark mark--csi">
                <img id="markCsi" src="assets/img/csi.jpg" alt="CSI" width="225" height="225">
            </span>

            <span class="cross" aria-hidden="true">&times;</span>

            <span class="mark mark--auron">
                <img id="markAuron" src="assets/img/auron.png" alt="Auron" width="699" height="727">
            </span>
        </div>

        <!-- Row 2: presents -->
        <p class="presents">presents</p>

        <!-- Row 3: the main logo, exactly as the file is -->
        <img class="main-logo" id="mainLogo" src="assets/img/logo1.png" alt="Pykachu Go" width="558"
            height="285">

        <!-- Progress: a 1.5s sweep, not a fake percentage -->
        <div class="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"
            aria-valuenow="0">
            <span class="progress-fill"></span>
        </div>
    </div>
</div>
