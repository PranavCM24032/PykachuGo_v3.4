                <div class="absolute left-0 top-0 size-2.5 rounded-tl-lg border-l-2 border-t-2 border-yellow-400/60">

                <div class="flex flex-col items-center text-center">

        <button id="nextSignalBtn" onclick="continueToQRScan()" onmousedown="playSound('click')"
