            <div class="absolute bottom-[25%] left-[15%] w-2 h-2 bg-blue-300 rounded-full animate-ping"
                style="animation-delay: 1.2s"></div>
            <div class="absolute bottom-[10%] right-[20%] w-2 h-2 bg-purple-300 rounded-full animate-pulse opacity-60"
                style="animation-delay: 0.8s"></div>
            <div class="absolute top-[40%] left-[5%] w-1.5 h-1.5 bg-yellow-400 rounded-full animate-ping"
                style="animation-delay: 2s"></div>
            <div class="absolute bottom-[40%] right-[5%] w-2 h-2 bg-blue-400 rounded-full animate-pulse"
                style="animation-delay: 1.5s"></div>

            <!-- Denser Perfect Twinkles -->
            <div class="perfect-sparkle sparkle-gold w-3 h-3 sm:w-4 sm:h-4 animate-twinkle top-[20%] left-[15%]"
                style="animation-duration: 2s;"></div>
            <div class="perfect-sparkle sparkle-white w-2 h-2 sm:w-3 sm:h-3 animate-twinkle top-[40%] right-[10%]"
                style="animation-delay: 0.3s; animation-duration: 1.8s;"></div>
            <div class="perfect-sparkle sparkle-blue w-1.5 h-1.5 sm:w-2 sm:h-2 animate-twinkle bottom-[30%] left-[10%]"

            <div class="perfect-sparkle sparkle-gold w-2 h-2 sm:w-3 sm:h-3 animate-twinkle top-[60%] right-[15%]"

        </div>

        <!-- Pokémon Display Stage (Impact Reactive) -->
        <div class="relative flex flex-col items-center justify-end shrink-0 w-full"

            <img id="caughtPokemonImg" src="" alt="Caught Pokémon"
                class="w-[clamp(120px,25vh,200px)] h-[clamp(120px,25vh,200px)] object-contain pokemon-success-glow z-10 relative">

            <!-- Enhanced Reactive Platform -->
            <div class="pokemon-platform" style="bottom: 5px;">
                <div class="platform-ring ring-blue"></div>
                <div class="platform-ring ring-yellow"></div>
                <div class="platform-ring ring-core"></div>
            </div>
        </div>

        <!-- Content Stack -->
        <div class="text-center w-full space-y-2 z-10 px-1 shrink-0">
            <h2 class="font-pixel text-green-400 tracking-tighter text-xs sm:text-sm">
                DECRYPTION SUCCESSFUL
            </h2>

            <!-- Location Card -->
            <div id="locationCard"
                class="bg-gray-900/80 border border-yellow-500/40 rounded-xl p-2 sm:p-3 relative overflow-hidden backdrop-blur-sm location-card-glow shadow-2xl mx-auto w-full max-w-xs">

                <div class="absolute top-0 left-0 w-2.5 h-2.5 border-t-2 border-l-2 border-yellow-400/50 rounded-tl-lg">

                <div
                    class="absolute top-0 right-0 w-2.5 h-2.5 border-t-2 border-r-2 border-yellow-400/50 rounded-tr-lg">
                </div>
                <div
                    class="absolute bottom-0 left-0 w-2.5 h-2.5 border-b-2 border-l-2 border-yellow-400/50 rounded-bl-lg">
                </div>
                <div
                    class="absolute bottom-0 right-0 w-2.5 h-2.5 border-b-2 border-r-2 border-yellow-400/50 rounded-br-lg">

            <!-- Multiple Destinations (branched signals) -->

        <!-- Final Completion Message (Dynamic) -->
        <div id="completionMessage" class="hidden z-20 w-full animate-fade-in px-1">
            <div
                class="relative overflow-hidden rounded-xl border border-yellow-500/50 bg-black/60 backdrop-blur-xl p-4 shadow-[0_0_20px_rgba(234,179,8,0.4)]">
                <div class="relative flex flex-col items-center text-center">
                    <!-- Trophy Display -->
                    <div class="w-16 h-16 sm:w-20 sm:h-20 mb-2 relative flex items-center justify-center">

                        <img id="completionTrophyImg"
                            src="assets/img/poketropy.png"

                            loading="eager"
                            width="80" height="80"

                            style="filter: drop-shadow(0 0 15px rgba(234,179,8,0.8));">

                        <div class="gemini-shine shine-1"></div>
                        <div class="gemini-shine shine-2"></div>
                        <div class="gemini-shine shine-3"></div>

                    <p id="completionLevelSub"
                        class="text-[9px] sm:text-[10px] text-blue-200 uppercase tracking-widest font-black">

                    <div class="flex gap-1.5 mt-2">

                        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-ping" style="animation-delay: 0.5s">
                        </div>
                        <div class="w-1.5 h-1.5 bg-yellow-400 rounded-full animate-ping" style="animation-delay: 1s">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="nextSignalBtn" onclick="continueToQRScan()" onmousedown="playSound('click')"

            SCAN NEXT SIGNAL
        </button>
    </div>
