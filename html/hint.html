<!-- Hint System -->
<div id="hintContainer" class="hidden">
    <!-- Hint Request Overlay -->
    <div id="hintRequestOverlay"
        class="hidden absolute inset-0 z-[90] glass-panel flex flex-col items-center justify-center p-4">
        <div
            class="bg-gray-900/90 border-2 border-yellow-600/50 rounded-xl p-4 sm:p-5 w-full max-w-xs sm:max-w-sm text-center">
            <span class="material-symbols-rounded text-yellow-500 text-3xl sm:text-4xl">lightbulb</span>
            <h3 class="font-pixel text-yellow-500 text-sm sm:text-base my-3">Hint Request</h3>
            <p class="text-gray-400 text-xs sm:text-sm mb-4">Requires <span id="hintPenaltyTime"
                    class="font-bold">60</span>s processing time. Stay on screen.</p>
            <div class="flex gap-2 sm:gap-3">
                <button onclick="confirmHintRequest()" onmousedown="playSound('click')"
                    class="bg-yellow-600 text-black font-bold flex-1 py-3 sm:py-4 rounded-lg text-sm sm:text-base hover:bg-yellow-700 transition-colors min-h-[44px]">
                    PROCEED
                </button>
                <button onclick="cancelHintRequest()" onmousedown="playSound('click')"
                    class="hidden \\bg-gray-800 text-white flex-1 py-3 sm:py-4 rounded-lg text-sm sm:text-base hover:bg-gray-700 transition-colors min-h-[44px]">
                    CANCEL
                </button>
            </div>
        </div>
    </div>

    <!-- Hint Penalty Overlay -->
    <div id="hintPenaltyOverlay"
        class="hidden absolute inset-0 z-[95] flex flex-col items-center justify-center p-4 backdrop-blur-3xl">

        <!-- Main Content Box -->
        <div
            class="text-center relative w-full max-w-xs sm:max-w-sm glass-black border border-amber-500/30 rounded-xl p-6 sm:p-8 backdrop-blur-sm">
            <div class="absolute inset-0 bg-gradient-to-br from-stone-900/80 via-amber-900/20 to-stone-900/80">
                <!-- Brock Watermark (Center, Large, Very Subtle) -->
                <div class="absolute inset-0 flex items-center justify-center opacity-10">
                    <img src="assets/img/brock.png" alt="Brock" class="h-[70%] max-h-64 object-contain opacity-90">
                </div>
            </div>
            <!-- Header -->
            <div class="mb-8">
                <h2 class="font-pixel text-amber-400 text-lg sm:text-xl uppercase tracking-widest mb-2">
                    GYM TRAINING
                </h2>
                <p class="text-xs sm:text-sm text-gray-400 uppercase">Brock's Discipline</p>
            </div>

            <!-- Timer Ring -->
            <div class="relative w-40 h-40 sm:w-48 sm:h-48 mx-auto mb-8">
                <svg class="w-full h-full -rotate-90">
                    <circle cx="50%" cy="50%" r="45%" stroke="rgba(245, 158, 11, 0.2)" stroke-width="4" fill="none" />
                    <circle cx="50%" cy="50%" r="45%" stroke="rgb(245, 158, 11)" stroke-width="4" fill="none"
                        class="hint-penalty-timer-ring" stroke-dasharray="452" stroke-dashoffset="452"
                        stroke-linecap="round" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <div class="font-pixel text-amber-300 text-4xl sm:text-5xl mb-2" id="hintTimerDisplay">60</div>
                    <span class="text-xs sm:text-sm text-amber-500/70 uppercase">Seconds</span>
                </div>
            </div>

            <!-- Status -->
            <div class="mb-6">
                <p class="text-amber-400 text-sm sm:text-base uppercase mb-2">
                    Decrypting Hint...
                </p>
                <p class="text-xs text-gray-500">
                    Stay focused on your training!
                </p>
            </div>

            <!-- Warning Message -->
            <div id="hintWarningMessage"
                class="hidden bg-red-900/40 border border-red-500/50 p-4 rounded-lg animate-shake mb-6">
                <div class="flex items-center justify-center gap-2">
                    <span class="material-symbols-rounded text-red-400 text-sm">warning</span>
                    <p class="text-red-400 text-xs sm:text-sm font-pixel uppercase">FOCUS LOST!</p>
                </div>
                <p class="text-red-300 text-xs mt-1" id="tabSwitchWarning">Tab switch detected. Timer
                    reset.</p>
            </div>

            <!-- Cancel Button -->
            <div class="mt-4 mb-4">
                <button onclick="cancelHintRequest()" onmousedown="playSound('click')"
                    class="w-full bg-gray-800/80 hover:bg-gray-700 text-gray-300 font-bold py-2 rounded-lg text-xs sm:text-sm border border-gray-600 transition-colors">
                    CANCEL TIMER
                </button>
            </div>

            <!-- Footer Quote -->
            <div class="border-t border-amber-500/20 pt-4">
                <p class="text-xs text-amber-500/60">
                    "Rock-solid focus wins battles."
                </p>
            </div>
        </div>
    </div>

    <!-- Hint Display -->
    <div id="hintDisplay" class="hidden absolute inset-0 z-[110] glass-panel flex items-center justify-center p-4">
        <div class="glass-blue border-2 border-blue-500/50 rounded-xl p-4 sm:p-5 w-full max-w-xs sm:max-w-sm relative">
            <button onclick="closeHintPopup()" onmousedown="playSound('click')"
                class="absolute top-2 right-2 text-gray-400 hover:text-white p-1">
                <span class="material-symbols-rounded">close</span>
            </button>
            <h3 class="font-pixel text-blue-400 text-sm sm:text-base mb-3">Hint Unlocked</h3>
            <div class="max-h-40 sm:max-h-48 overflow-y-auto">
                <p id="hintText" class="text-white text-sm sm:text-base font-mono leading-relaxed"></p>
            </div>
            <button onclick="closeHintPopup()" onmousedown="playSound('click')"
                class="btn-pokedex w-full mt-4 py-3 text-sm sm:text-base">
                CLOSE
            </button>
        </div>
    </div>
</div>
