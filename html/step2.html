<div id="step2" class="flow-step h-full">
    <div class="flex flex-col h-full justify-center items-center gap-4 p-3 sm:p-5">
        <div class="text-center w-full shrink-0">
            <h2 class="font-pixel text-blue-400 mb-1 tracking-widest uppercase text-xs sm:text-sm">
                Signal Tracking
            </h2>
            <p class="text-gray-400 text-[10px] sm:text-xs">Locate regional QR tags</p>
        </div>

        <div class="qr-radar mx-auto shrink-0">
            <div class="qr-radar-scan"></div>
            <div class="qr-radar-scan" style="animation-delay: 0.5s;"></div>
            <div class="qr-radar-scan" style="animation-delay: 1s;"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-[45%] h-[45%] border-2 border-blue-400/30 rounded-2xl flex items-center justify-center bg-blue-500/5">
                    <span class="material-symbols-rounded text-blue-400 animate-pulse text-2xl sm:text-3xl">
                        qr_code_scanner
                    </span>
                </div>
            </div>
        </div>

        <div class="w-full max-w-xs space-y-2.5 shrink-0">
            <button onclick="startQRScanner()" onmousedown="playSound('click')"
                class="btn-pokedex w-full flex items-center justify-center gap-2 py-3 text-xs sm:text-sm min-h-[48px]">
                <span class="material-symbols-rounded text-base sm:text-lg">radar</span>
                ACTIVATE SENSORS
            </button>
            <button onclick="showManualEntry()" onmousedown="playSound('click')"
                class="w-full flex items-center justify-center py-3 min-h-[48px] text-[10px] sm:text-xs text-blue-400/70 hover:text-blue-400 font-pixel border border-blue-400/30 rounded-xl hover:bg-blue-400/5 transition-all uppercase tracking-tighter">
                Manual Override
            </button>
        </div>
    </div>

    <!-- QR Scanner Overlay -->
    <div id="qrScannerContainer" class="hidden absolute inset-0 z-[130] bg-black">
        <div class="relative h-full w-full overflow-hidden flex flex-col">
            <video id="qrVideo" class="w-full h-full object-cover"></video>
            <canvas id="qrCanvas" class="hidden"></canvas>
            <div class="absolute inset-0 flex flex-col">
                <div class="flex justify-between items-start p-3 sm:p-4">
                    <div class="bg-black/60 p-2 sm:p-3 rounded-lg border border-blue-500/30">
                        <p class="font-pixel text-blue-400 text-xs sm:text-sm uppercase">Scanner Active</p>
                    </div>
                    <button onclick="stopQRScanner()"
                        class="bg-red-600/80 text-white p-2 sm:p-3 rounded-lg min-h-[44px] min-w-[44px] flex items-center justify-center">
                        <span class="material-symbols-rounded text-lg sm:text-xl">close</span>
                    </button>
                </div>
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="relative w-full aspect-square max-w-48 sm:max-w-64">
                        <div class="absolute inset-0 border-2 border-blue-400/50 rounded-lg"></div>
                        <div class="absolute top-0 left-0 w-6 h-6 sm:w-8 sm:h-8 border-t-2 border-l-2 border-blue-400">
                        </div>
                        <div class="absolute bottom-0 right-0 w-6 h-6 sm:w-8 sm:h-8 border-b-2 border-r-2 border-blue-400">
                        </div>
                        <div class="absolute top-0 left-0 w-full h-0.5 bg-blue-400/80 animate-scanline">
                        </div>
                    </div>
                </div>
                <div id="zoomControlContainer" class="hidden px-5 pb-2">
                    <div
                        class="flex items-center gap-2 bg-black/70 backdrop-blur-xl rounded-full px-4 py-2.5 border border-white/10 shadow-lg">
                        <span class="material-symbols-rounded text-white/40 text-base select-none">remove</span>
                        <div class="flex-1 relative flex items-center">
                            <input type="range" id="qrZoomSlider" min="1" max="5" step="0.1" value="1"
                                class="w-full h-1 rounded-full appearance-none cursor-pointer"
                                style="accent-color:#3b82f6; background:rgba(255,255,255,0.12);">
                        </div>
                        <span class="material-symbols-rounded text-white/40 text-base select-none">add</span>
                    </div>
                </div>
                <div class="p-3 sm:p-4 text-center">
                    <p class="text-white/70 text-xs sm:text-sm">Point camera at QR code</p>
                    <p class="text-gray-500 text-[10px] sm:text-xs mt-1">Make sure code is within frame</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Manual Entry Overlay -->
    <div id="manualEntryContainer"
        class="hidden absolute inset-0 z-[120] glass-panel flex flex-col items-center justify-center p-4">
        <div class="glass-blue border-2 border-blue-500/50 rounded-xl p-4 sm:p-5 w-full max-w-xs sm:max-w-sm shadow-2xl">
            <h3 class="font-pixel text-blue-400 text-sm sm:text-base mb-4 text-center uppercase">Manual
                Entry</h3>
            <div class="mb-4">
                <label class="block text-gray-500 text-xs sm:text-sm uppercase mb-2">Signal ID</label>
                <input type="text" id="manualSignalId"
                    class="w-full bg-black/50 border-2 border-blue-500/30 rounded-lg p-3 sm:p-4 text-white font-mono text-sm sm:text-base focus:border-blue-500 outline-none uppercase min-h-[44px]"
                    placeholder="XG01" autocomplete="off" autocapitalize="characters">
            </div>
            <div class="flex gap-2 sm:gap-3">
                <button onclick="submitManualEntry()"
                    class="btn-pokedex flex-1 py-3 sm:py-4 text-sm sm:text-base">DECODE</button>
                <button onclick="hideManualEntry()"
                    class="flex-1 bg-gray-800 text-gray-400 py-3 sm:py-4 rounded-lg text-sm sm:text-base hover:bg-gray-700 transition-colors min-h-[44px]">
                    CANCEL
                </button>
            </div>
        </div>
    </div>
</div>
