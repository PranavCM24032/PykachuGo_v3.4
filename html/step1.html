<div id="step1" class="flow-step h-full">
    <div class="flex flex-col h-full justify-center items-center gap-3 p-3 sm:p-5">
        <div class="text-center w-full shrink-0">
            <h2
                class="font-pixel text-blue-400 mb-1 tracking-widest uppercase text-[10px] sm:text-xs">
                Trainer Identification
            </h2>
            <p class="text-gray-400 mb-1 sm:mb-2 text-[10px] sm:text-xs">Sync Kanto Network</p>

            <div class="relative flex justify-center mx-auto mb-1 sm:mb-2">
                    <div
                        class="relative w-14 h-14 sm:w-16 sm:h-16 bg-gray-900 rounded-full flex items-center justify-center border border-blue-500/20">
                    <div class="p-1 w-full h-full">
                        <img src="assets/img/ash-3.png" alt="Ash"
                            class="w-full h-full rounded-full object-cover filter brightness-90" />
                    </div>
                </div>
            </div>

        </div>

        <form id="registrationForm" class="w-full max-w-[300px] sm:max-w-xs">
            <div>
                <label
                    class="block text-gray-500 uppercase tracking-widest mb-0.5 sm:mb-1 ml-1 font-bold text-[9px] sm:text-[10px]">
                    Team Name
                </label>
                <div class="relative">
                    <input type="text" id="teamName"
                        class="w-full bg-black/40 border border-slate-800 rounded-lg px-2 py-1.5 sm:px-3 sm:py-2 text-white focus:border-blue-500 focus:outline-none placeholder-gray-600 uppercase transition-all text-[11px] sm:text-xs"
                        placeholder="TRAINER NAME" autocomplete="off" required maxlength="50"
                        autocapitalize="characters">
                    <span
                        class="material-symbols-rounded absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm sm:text-base">
                        badge
                    </span>
                </div>
            </div>

            <div>
                <label
                    class="block text-gray-500 uppercase tracking-widest mb-0.5 sm:mb-1 ml-1 font-bold text-[9px] sm:text-[10px]">
                    Security Key
                </label>
                <div class="relative">
                    <input type="password" id="teamPassword"
                        class="w-full bg-black/40 border border-slate-800 rounded-lg px-2 py-1.5 sm:px-3 sm:py-2 text-white focus:border-blue-500 focus:outline-none placeholder-gray-600 transition-all font-mono text-[11px] sm:text-xs"
                        placeholder="••••" autocomplete="off" required maxlength="50">
                    <button type="button" onclick="togglePasswordVisibility()"
                        onmousedown="playSound('click')"
                        class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-400 transition-colors focus:outline-none">
                        <span id="passwordToggleIcon"
                            class="material-symbols-rounded text-sm sm:text-base">
                            visibility_off
                        </span>
                    </button>
                </div>
            </div>

            <div>
                <label
                    class="block text-gray-500 uppercase tracking-widest mb-0.5 sm:mb-1 ml-1 font-bold text-[9px] sm:text-[10px]">
                    Language
                </label>
                <div class="relative group">
                    <select id="codeLanguage"
                        class="w-full bg-black/40 border border-slate-800 rounded-lg px-2 py-1.5 sm:px-3 sm:py-2 text-white focus:border-blue-500 focus:outline-none appearance-none cursor-pointer transition-all hover:border-blue-500/50 text-[11px] sm:text-xs">
                        <option value="PYTHON" class="bg-[#050810] text-gray-300">🐍 PYTHON</option>
                        <option value="CPP" class="bg-[#050810] text-gray-300">⚡ C++</option>
                    </select>
                    <span
                        class="material-symbols-rounded absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none group-hover:text-blue-400 transition-colors text-sm sm:text-base">
                        code
                    </span>
                </div>
            </div>

            <div>
                <label
                    class="block text-gray-500 uppercase tracking-widest mb-0.5 sm:mb-1 ml-1 font-bold text-[9px] sm:text-[10px]">
                    Mission Discovery
                </label>
                <div class="relative group">
                    <select id="missionLevel"
                        class="w-full bg-black/40 border border-slate-800 rounded-lg px-2 py-1.5 sm:px-3 sm:py-2 text-white focus:border-blue-500 focus:outline-none appearance-none cursor-pointer transition-all hover:border-blue-500/50 text-[11px] sm:text-xs">
                        <optgroup label="LEVEL 1: ELEMENTAL" class="bg-[#0a0f1d] text-blue-400">
                            <option value="L1_GRASS" class="bg-[#050810] text-gray-300">🌿 GRASS SECTOR
                            </option>
                            <option value="L1_FIRE" class="bg-[#050810] text-gray-300">🔥 FIRE SECTOR
                            </option>
                            <option value="L1_WATER" class="bg-[#050810] text-gray-300">💧 WATER SECTOR
                            </option>
                            <option value="L1_GROUND" class="bg-[#050810] text-gray-300">🌍 GROUND
                                SECTOR</option>
                        </optgroup>
                        <optgroup label="LEVEL 2: ELITE" class="bg-[#0a0f1d] text-yellow-500">
                            <option value="L2_CHARIZARD" class="bg-[#050810] text-gray-300">🐲 CHARIZARD
                                ASCENT</option>
                            <option value="L2_GRENINJA" class="bg-[#050810] text-gray-300">🐸 GRENINJA
                                STRIKE</option>
                        </optgroup>
                        <optgroup label="LEVEL 3: ULTIMATE" class="bg-[#0a0f1d] text-red-500">
                            <option value="L3_PIKACHU" class="bg-[#050810] text-gray-300">⚡ PIKACHU GO
                            </option>
                        </optgroup>
                    </select>
                    <span
                        class="material-symbols-rounded absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none group-hover:text-blue-400 transition-colors text-sm sm:text-base">
                        expand_more
                    </span>
                </div>
            </div>

            <div id="registrationFeedback"
                class="hidden text-[10px] sm:text-xs p-1.5 sm:p-2 rounded-lg mb-1 sm:mb-2 bg-red-900/20 border border-red-900/40 text-red-100 font-pixel">
            </div>

            <button type="submit" onmousedown="playSound('powerUp')"
                class="btn-pokedex w-full flex items-center justify-center gap-1.5 sm:gap-2 py-1.5 sm:py-2 text-[10px] sm:text-xs">
                <span class="material-symbols-rounded text-sm sm:text-base">play_arrow</span>
                START GO
            </button>
        </form>
    </div>
</div>
